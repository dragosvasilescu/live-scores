name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LiveScores.sln

      - name: Build
        run: dotnet build LiveScores.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test LiveScores.sln --no-build --configuration Release
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Generator still produces a stream
        run: dotnet run tools/event_generator.cs -- --count 200 --out events.ndjson && test "$(wc -l < events.ndjson)" -eq 200

  iac:
    name: Validate & lint Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build (compile + validate)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Lint (warnings fail the build)
        run: |
          az bicep lint --file infra/main.bicep 2> lint.txt || true
          cat lint.txt
          if grep -Eq "(Warning|Error) " lint.txt; then exit 1; fi
